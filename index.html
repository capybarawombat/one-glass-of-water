<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#091c1d"/><meta name="description" content="Every glass has a story. A cinematic, gesture-driven experience about water, livelihoods and the people who make safe access possible."/><title>One Glass of Water — Every glass has a story</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"/></head><body><div id="root"></div><noscript><main style="max-width:700px;margin:40px auto;padding:20px;font:17px/1.6 Georgia,serif;color:#233f48;background:#eaece2"><h1>One glass of water.</h1><p>2.1 billion people lacked safely managed drinking water in 2024. [1] Safe water requires source protection, appropriate treatment, reliable delivery and ongoing monitoring.</p><p>Safely managed water is from an improved source, on premises, available when needed, and free from specified contamination. [2]</p><p>Please enable JavaScript for the interactive journey.</p><h2>Sources &amp; Further Reading</h2><ol style="list-style:none;padding:0"><li>[1] WHO &amp; UNICEF (2025). <a href="https://data.unicef.org/resources/jmp-report-2025/" target="_blank" rel="noopener noreferrer">Progress on Household Drinking Water, Sanitation and Hygiene 2000–2024: Special Focus on Inequalities.</a></li><li>[2] WHO/UNICEF Joint Monitoring Programme (JMP). <a href="https://washdata.org/monitoring/drinking-water" target="_blank" rel="noopener noreferrer">Drinking Water Service Levels and Definitions.</a></li><li>[3] World Bank. <a href="https://data.worldbank.org/indicator/SH.H2O.SMDW.ZS" target="_blank" rel="noopener noreferrer">People Using Safely Managed Drinking Water Services (% of Population). Indicator SH.H2O.SMDW.ZS.</a> <a href="https://data.worldbank.org/indicator/SH.H2O.SMDW.ZS?locations=VN" target="_blank" rel="noopener noreferrer">Viet Nam data</a></li><li>[4] UNESCO (2024). <a href="https://www.unesco.org/en/reports/wwdr/2024" target="_blank" rel="noopener noreferrer">United Nations World Water Development Report 2024: Water for Prosperity and Peace.</a> <a href="https://www.unesco.org/reports/wwdr/en/2024/s" target="_blank" rel="noopener noreferrer">Statistics</a></li><li>[5] UNICEF Viet Nam (2024). <a href="https://www.unicef.org/vietnam/more-88000-children-affected-drought-mekong-river-delta-provinces" target="_blank" rel="noopener noreferrer">More Than 88,000 Children Affected by the Drought in the Mekong River Delta Provinces.</a></li><li>[6] UN-Water. <a href="https://www.sdg6data.org/" target="_blank" rel="noopener noreferrer">SDG 6 Data — Sustainable Water and Sanitation Management.</a></li><li>[7] UNICEF. <a href="https://www.unicef.org/wash" target="_blank" rel="noopener noreferrer">Water, Sanitation and Hygiene (WASH).</a></li><li>[8] World Bank (2020). <a href="https://www.worldbank.org/en/results/2020/04/29/built-to-last-upgrading-rural-water-supply-and-sanitation-through-results-based-financing-the-vietnam-experience" target="_blank" rel="noopener noreferrer">Built to Last — Upgrading Rural Water Supply and Sanitation Through Results-Based Financing: The Vietnam Experience.</a></li><li>[9] Government of Viet Nam (2021). <a href="https://baochinhphu.vn/chien-luoc-quoc-gia-cap-nuoc-sach-ve-sinh-nong-thon-den-nam-2030-102304453.htm" target="_blank" rel="noopener noreferrer">National Strategy for Rural Clean Water Supply and Sanitation to 2030, with a Vision to 2045 — Decision 1978/QĐ-TTg (Vietnamese).</a></li><li>[10] World Bank (2024). <a href="https://www.worldbank.org/en/news/press-release/2024/01/12/world-bank-approves-project-to-improve-living-environment-for-over-half-a-million-people-in-southern-vietnam" target="_blank" rel="noopener noreferrer">World Bank Approves Project to Improve Living Environment for Over Half a Million People in Southern Viet Nam.</a></li><li>[11] World Bank (2024). <a href="https://www.worldbank.org/en/news/feature/2024/05/14/greening-viet-nam-s-rice-bowl-a-mekong-delta-success-story" target="_blank" rel="noopener noreferrer">Greening Viet Nam’s Rice Bowl: A Mekong Delta Success Story.</a></li></ol></main></noscript><script type="module" src="/src/main.tsx"></script></body></html>
